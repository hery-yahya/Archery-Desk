function autoMap(){const m={},u=new Set(),H=S.hdr;

 for(const k in G){const L=G[k],pr=S.cfg.prim=='age',tr=L[0].tr;if((tr=='P'||tr=='E')&&L.length==1){L[0].code=k;continue}
  const b=L.filter(d=>d.rk==null),n=L.filter(d=>d.rk!=null);b.forEach(d=>d.code=k+(b.length>1?'-'+d.di:''));

const GEN=/^(archery|club|school|sekolah|academy|akademi|community|komunitas|team|ac)$/i,ART=/^(al|el|at|ad|ar|ash|ath|an)$/i;
function kode(n){let t=n.replace(/\(.*?\)/g,' ').replace(/[^A-Za-z0-9 -]/g,' ').split(/[\s-]+/).filter(Boolean);if(!t.length)return'XXX';if(t.length>1&&ART.test(t[0]))t=t.slice(1);
 const sk=w=>{const x=w[0]+w.slice(1).replace(/[aeiou]/gi,'');return(x.length<3?w:x).slice(0,5)},ab=w=>/^[A-Z]{2,5}$/.test(w),I=a=>a.map(w=>w.replace(/[^A-Za-z]/g,'')[0]||'').join(''),D=t.filter(w=>!GEN.test(w));let c;

 $('#tb').innerHTML='<b>Data rapi</b>'+T(['No','Nama','Divisi','L/P','Klub','Kode','Lahir','WA','Catatan'],D.E.slice(0,600).map((e,i)=>[i+1,esc(e.name),e.dv.code||'?',e.gn||'?',esc(e.cl.n),e.cl.c,e.dob?iso(e.dob):'',e.ph.v,esc(e.fl.join('; '))]));
 const V=D.E.filter(e=>e.ok),U=new Set(V.map(e=>e.pk)),uq={M:new Set,W:new Set},ec={M:0,W:0},cnt={},cl={};V.forEach(e=>{uq[e.gn].add(e.pk);ec[e.gn]++;cnt[e.pk]=(cnt[e.pk]||0)+1;const c=cl[e.cl.c]=cl[e.cl.c]||{n:e.cl.n,p:new Set,e:0};c.p.add(e.pk);c.e++});

 <div class="card sc"><b>Per gender</b>${T(['Gender','Kepesertaan','Nama unik'],[['Putra',ec.M,uq.M.size],['Putri',ec.W,uq.W.size],{t:1,c:['Total',V.length,U.size]}],[0,1,1])}</div>
 <div class="card sc"><b>Peserta multi-kategori</b>${T(['Jumlah kategori per orang','Jumlah orang'],Object.entries(dist).sort().map(([a,b])=>[a,b]),[0,1])}</div>

function plan(){const ph=S.ph,Q=S.P[ph],s=Q.ses[Q.cur],C=S.cfg,R={q:S.P.q.ses.map(x=>sres(x,'q')),e:S.P.e.ses.map(x=>sres(x,'e'))},r=R[ph][Q.cur],pq=Math.max(0,...R.q.map(x=>x.need)),pe=Math.max(0,...R.e.map(x=>x.need)),at=k=>Q.ses.findIndex(x=>x.it.includes(k)),bk=ph=='q'?'bq':'be',bt=+C[bk]||0;
 const conf=(()=>{const c={};s.it.forEach(k=>{const[dk,gn]=k.split('#');D.E.filter(e=>e.ok&&e.dv.k==dk&&e.gn==gn).forEach(e=>(c[e.pk]=c[e.pk]||new Set).add(k))});return Object.entries(c).filter(([p,v])=>v.size>1).map(([p])=>D.P[p].name)})();
 const sel=k=>`<select data-p="${k}">${[1,2,3,4].map(v=>`<option${C.per[k]==v?' selected':''}>${v}</option>`).join('')}</select>`,
 chip=(d,gn,l)=>{if(!d.n[gn])return'';const k=d.k+'#'+gn,a=at(k);return`<button class="chip ${a==Q.cur?'on':a>=0?'ot':''}" data-g="${gn}" data-k="${k}">${l} ${d.n[gn]}${a>=0&&a!=Q.cur?' · '+(a+1):''}</button>`},
 ck=(o,l)=>`<label><input type="checkbox" data-o="${o}"${C[o]?' checked':''}> ${l}</label>`;

 <div class="seg"><button data-ph="q" class="${ph=='q'?'on':''}">Kualifikasi</button><button data-ph="e" class="${ph=='e'?'on':''}">Eliminasi</button></div>
 <div class="tabs">${Q.ses.map((x,i)=>`<button data-s="${i}" class="${i==Q.cur?'on':''}">${esc(x.n)}</button>`).join('')}<button class="s" id="sa">+ Sesi</button></div>
 <div class="card"><b>Pilih kategori — ${esc(s.n)}</b>${ph=='e'&&!C.pe?'<p class="m" style="margin:0">Divisi Pemula tidak punya eliminasi (ubah di tab Ekspor → Pengaturan).</p>':''}${D.dl.filter(d=>okd(d,ph)).map(d=>`<div class="row"><div class="l"><b>${d.code}</b> <small>${esc(d.label)}</small></div>${chip(d,'M','Putra')}${chip(d,'W','Putri')}</div>`).join('')}
 <p style="margin:10px 0 0"><button class="s" id="sr">Ganti nama</button> ${Q.ses.length>1?'<button class="s" id="sd">Hapus sesi</button>':''}</p></div>
 <div class="card sc"><b>Hasil ${esc(s.n)}<span class="big">${r.need} bantalan</span></b>${r.rows.length?T(['Kategori','n',...cols(ph)],[...r.rows.map(x=>[x.c.d.code+' '+(x.c.g=='M'?'Putra':'Putri'),x.c.n,...x.b]),{t:1,c:['Total babak','',...r.tot]}],[0,1,...cols(ph).map(_=>1)]):'<span class="m">Klik kategori di atas.</span>'}
 ${conf.length?`<div class="w">⚠️ Bentrok: ${conf.length} orang ada di ≥2 kategori pada sesi ini — ${conf.slice(0,12).map(esc).join(', ')}</div>`:''}
 <label>Bantalan tersedia <input type="number" min="0" data-b="${bk}" value="${bt||''}" style="width:90px"></label>${bt&&r.need?`<p style="margin:0">→ <b>${Math.ceil(r.need/bt)} gelombang</b></p>`:''}</div>
 <div class="card sc"><b>Ringkasan ${ph=='q'?'Kualifikasi':'Eliminasi'}</b>${T(['Sesi','Kategori','Kebutuhan bantalan'],[...Q.ses.map((x,i)=>[esc(x.n),x.it.length,R[ph][i].need]),{t:1,c:['Puncak '+(ph=='q'?'kualifikasi':'eliminasi'),'',ph=='q'?pq:pe]}],[0,1,1])}<p class="m" style="margin:8px 0 0">Belum dijadwalkan: ${D.dl.filter(d=>okd(d,ph)).reduce((a,d)=>a+['M','W'].filter(x=>d.n[x]&&at(d.k+'#'+x)<0).length,0)} kategori. Tiap kategori &amp; gender memakai bantalan sendiri.</p></div>`}

 const B=[['Fase','Sesi','Kode','Divisi','Gender','n','Kualifikasi','1/8 Final','1/4 Final','1/2 Final','Final (E+P)']],ids=['r16','r8','r4','f'];

 A('Aturan Bantalan',[['Babak','Archer/bantalan','Aktif'],['Kualifikasi',C.per.q,'Ya'],['1/8 Final',C.per.r16,C.on16?'Ya':'Tidak'],['1/4 Final',C.per.r8,C.on8?'Ya':'Tidak'],['1/2 Final',C.per.r4,'Ya'],['Final (Emas+Perunggu)',C.per.f,'Ya']]);XLSX.writeFile(wb,'ArcheryDesk.xlsx')}
