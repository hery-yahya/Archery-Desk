<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SN={R:'Recurve',B:'Barebow',C:'Compound',N:'Nasional',H:'Horsebow'},RL={name:'Nama',gender:'Gender',dob:'Tgl lahir',club:'Klub/Sekolah',div:'Divisi',phone:'WhatsApp'};
const DC={asc:0,prim:'age',ref:'',exh:0,pe:0,on16:0,on8:1,bq:0,be:0,st:{},per:{q:4,r16:2,r8:2,r4:1,f:1}};let S={hdr:[],rows:[],map:{},cfg:{...DC},P:null,pl:null,pi:0,ph:'q'},D=null;
const PK=['per','on16','on8','bq','be','st','pe'],J=o=>JSON.parse(JSON.stringify(o));
function mkPlan(n,f){const c={};PK.forEach(k=>c[k]=J(f?f.c[k]:DC[k]));return{n,c,P:f?J(f.P):{q:{ses:[{n:'Kualifikasi 1',it:[]}],cur:0},e:{ses:[{n:'Eliminasi 1',it:[]}],cur:0}}}}
function applyPlan(){const p=S.pl[S.pi];S.P=p.P;PK.forEach(k=>S.cfg[k]=p.c[k])}

function eachPlan(fn){syncPlan();const cur=S.pi;S.pl.forEach((p,i)=>{S.pi=i;applyPlan();fn(p,i)});S.pi=cur;applyPlan()}
function rsP(){S.pl=[mkPlan('Plan A')];S.pi=0;applyPlan()}
try{const x=JSON.parse(localStorage.getItem('ad')||'null');if(x)S=Object.assign(S,x)}catch(e){}
S.cfg=Object.assign({},DC,S.cfg);S.cfg.per=Object.assign({},DC.per,S.cfg.per);S.cfg.st=Object.assign({},S.cfg.st);if(!S.pl){const c={};PK.forEach(k=>c[k]=S.cfg[k]);S.pl=[{n:'Plan A',c,P:S.P||mkPlan('x').P}];S.pi=0}applyPlan();S.cfg.per=Object.assign({},DC.per,S.cfg.per);S.cfg.st=Object.assign({},S.cfg.st);syncPlan();
const save=()=>{try{if(S.pl)syncPlan();localStorage.setItem('ad',JSON.stringify(S))}catch(e){}};
const nk=s=>s.toLowerCase().replace(/[^\p{L}\p{N} ]/gu,' ').replace(/\s+/g,' ').trim(),iso=d=>d.toISOString().slice(0,10);
const g=v=>{v=String(v).trim().toLowerCase();return /^(m|l|man|men|male|laki.*|pria|putra|boy)$/.test(v)?'M':/^(w|f|p|woman|women|female|perempuan|wanita|putri|girl)$/.test(v)?'W':null};
const age=(d,r)=>{let a=r.getUTCFullYear()-d.getUTCFullYear();if(r.getUTCMonth()<d.getUTCMonth()||(r.getUTCMonth()==d.getUTCMonth()&&r.getUTCDate()<d.getUTCDate()))a--;return a};
/* ---- impor ---- */
const SYN={name:/nama|full ?name|^name|athlete|atlet|peserta/i,gender:/gender|kelamin|^jk$|^sex/i,dob:/birth|lahir|dob|^ttl/i,club:/club|klub|kontingen|sekolah|school|contingent|^team|asal/i,div:/division|divisi|kategori|category|^kelas/i,phone:/whats|^wa|^hp|telepon|phone|kontak/i};
function parseText(t){const L=t.replace(/\r/g,'').split('\n').filter(l=>l.trim()),d=['\t',';',','].map(c=>[c,L.slice(0,5).join('').split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];return L.map(l=>l.split(d))}
function load(a){a=a.map(r=>r.map(c=>c==null?'':c));const f=r=>r.filter(x=>String(x).trim()).length;let h=a.findIndex((r,i)=>f(r)>=3&&a[i+1]&&f(a[i+1])>=3&&r.filter(x=>typeof x=='string'&&isNaN(x)).length>=3);if(h<0)h=0;
 S.hdr=a[h].map(x=>String(x).trim());S.rows=a.slice(h+1).filter(r=>f(r));S.map=autoMap();rsP();run()}
function autoMap(){const m={},u=new Set(),H=S.hdr;
 for(const r in SYN){const i=H.findIndex((h,i)=>!u.has(i)&&SYN[r].test(h));if(i>=0){m[r]=i;u.add(i)}}
 const fr=(i,f)=>{const c=S.rows.slice(0,200).map(r=>String(r[i]).trim()).filter(Boolean);return c.length?c.filter(f).length/c.length:0};
 H.forEach((h,i)=>{if(u.has(i))return;const set=k=>{m[k]=i;u.add(i)};
  if(m.gender==null&&fr(i,v=>g(v))>.9)set('gender');else if(m.div==null&&fr(i,v=>/recurve|compound|barebow|nasional|horse/i.test(v))>.7)set('div');
  else if(m.dob==null&&fr(i,v=>/^\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}$/.test(v))>.8)set('dob');else if(m.phone==null&&fr(i,v=>v.replace(/\D/g,'').length>=9)>.7)set('phone')});return m}
/* ---- normalisasi ---- */
function dcol(i){let a=0,b=0;S.rows.forEach(r=>{const m=String(r[i]).match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);if(m){if(+m[1]>12)a++;if(+m[2]>12)b++}});return b>a?'md':'dm'}
function pdt(v,o){if(v===''||v==null)return null;if(typeof v=='number')return new Date(Math.round((v-25569)*864e5));v=String(v).trim();let m=v.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);if(m)return new Date(Date.UTC(+m[1],m[2]-1,+m[3]));
 m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);if(!m)return null;let y=+m[3];if(y<100)y+=y>30?1900:2000;const[d,mo]=o=='dm'?[+m[1],+m[2]]:[+m[2],+m[1]];return mo<1||mo>12||d<1||d>31?null:new Date(Date.UTC(y,mo-1,d))}
function nph(v){let d=String(v).replace(/\D/g,'');if(!d)return{v:'',bad:0};if(d.startsWith('62'))d='0'+d.slice(2);else if(d[0]=='8')d='0'+d;return{v:d,bad:(d.length<10||d.length>13||/[a-z]/i.test(String(v)))?1:0}}
function pd(t){t=String(t||'').toLowerCase();const st=/recurve/.test(t)?'R':/barebow/.test(t)?'B':/compound/.test(t)?'C':/horse/.test(t)?'H':/nasional|standar|std/.test(t)?'N':'?',tr=/pemula|beginner|novice/.test(t)?'P':/exhib|eksibisi|demo/.test(t)?'E':'';let rk=null,lb='',m;
 if(m=t.match(/\bu\s?-?(\d+)|under\s?(\d+)/)){rk=+(m[1]||m[2]);lb='U'+rk}else if(/\bsma\b|smk/.test(t)){rk=18;lb='SMA'}else if(/smp|mts/.test(t)){rk=15;lb='SMP'}else if(m=t.match(/\bsd\D*(\d)\s*[-–]\s*(\d)/)){rk=+m[2]+6;lb='SD '+m[1]+'-'+m[2]}
 const di=+((t.match(/(\d+)\s*m\b/)||[])[1]||0);return{st,tr,rk,di,k:[st,tr,rk,di].join('|'),nm:(SN[st]||'?')+(tr=='P'?' Pemula':tr=='E'?' Exhibition':'')+(lb?' '+lb:''),label:(SN[st]||'?')+(tr=='P'?' Pemula':tr=='E'?' Exhibition':'')+(lb?' '+lb:'')+(di?' '+di+'M':'')}}
function codes(dv){const G={};Object.values(dv).forEach(d=>(G[d.st+d.tr]=G[d.st+d.tr]||[]).push(d));
 for(const k in G){const L=G[k],pr=S.cfg.prim=='age',tr=L[0].tr;if((tr=='P'||tr=='E')&&L.length==1){L[0].code=k;continue}
  const b=L.filter(d=>d.rk==null),n=L.filter(d=>d.rk!=null);b.forEach(d=>d.code=k+(b.length>1?'-'+d.di:''));
  n.sort((x,y)=>{const c=(pr?x.rk-y.rk:x.di-y.di)||(pr?x.di-y.di:x.rk-y.rk);return +S.cfg.asc?c:-c});n.forEach((d,i)=>d.code=k+(tr=='E'&&!S.cfg.exh?'?':'')+(i+1))}}
